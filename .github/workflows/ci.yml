name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, feat/phase-10-vscode-extension, feat/phase-11-release]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (dependency order)
        run: pnpm build

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Lint (Biome)
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Extension Host tests
        run: cd apps/vscode-extension && xvfb-run -a pnpm test:integration

  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Package VSIX
        run: pnpm package
        working-directory: apps/vscode-extension

      - name: Compute SHA-256
        working-directory: artifacts/release
        run: |
          sha256sum contextforge-1.0.0-rc.1.vsix > contextforge-1.0.0-rc.1.vsix.sha256
          cat contextforge-1.0.0-rc.1.vsix.sha256

      - name: Verify SHA-256
        working-directory: artifacts/release
        run: sha256sum --check contextforge-1.0.0-rc.1.vsix.sha256

      - name: List package contents
        run: pnpm package:ls
        working-directory: apps/vscode-extension

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: contextforge-1.0.0-rc.1
          path: |
            artifacts/release/contextforge-1.0.0-rc.1.vsix
            artifacts/release/contextforge-1.0.0-rc.1.vsix.sha256
          retention-days: 90
